plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hany.sendbis'
    compileSdk 34

    defaultConfig {
        applicationId "com.hany.sendbis"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // اللعبة ملف HTML كبير: لا نضغط الأصول حتى يبقى التحميل سريعا
    androidResources {
        noCompress 'html'
    }
}
